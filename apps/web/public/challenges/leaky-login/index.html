<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Atlys Internal Tools — Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    color: #e5e7eb;
  }
  .card {
    width: 320px;
    background: #171a21;
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    padding: 28px;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { color: #9ca3af; font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 14px;
    border-radius: 8px;
    border: 1px solid #2a2e3a;
    background: #0f1115;
    color: #e5e7eb;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #7c5cff;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #msg { margin-top: 12px; font-size: 13px; text-align: center; min-height: 18px; }
  #msg.error { color: #ff4d6d; }
  #msg.success { color: #00e5b0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Internal Tools Console</h1>
    <p class="sub">Atlys staff login</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" autocomplete="off" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="off" />
      <button type="submit">Sign in</button>
    </form>
    <div id="msg"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
